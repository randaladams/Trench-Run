name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: trench-run-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Keeps ONE release ("prototype") and replaces its APK on every build, so these links never change:
      #   https://github.com/randaladams/Trench-Run/releases/latest/download/TrenchRun.apk
      #   https://github.com/randaladams/Trench-Run/releases/download/prototype/TrenchRun.apk
      - name: Publish APK to the permanent download link
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TrenchRun.apk
          TITLE="Trench Run (build ${{ github.run_number }})"
          NOTES="Latest build from main (build ${{ github.run_number }}, commit ${GITHUB_SHA::7}). Open TrenchRun.apk on your Android phone to install or update."
          git tag -f prototype
          git push -f origin refs/tags/prototype
          if gh release view prototype > /dev/null 2>&1; then
            gh release upload prototype TrenchRun.apk --clobber
            gh release edit prototype --title "$TITLE" --notes "$NOTES" --prerelease=false --latest
          else
            gh release create prototype TrenchRun.apk --title "$TITLE" --notes "$NOTES" --latest
          fi
