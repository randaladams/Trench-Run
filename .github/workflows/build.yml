name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: trench-run-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Publishes the newest build as the "prototype" pre-release so it can be
      # downloaded straight to a phone from the repo's Releases page.
      - name: Publish prototype release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TrenchRun.apk
          gh release delete prototype --yes --cleanup-tag || true
          gh release create prototype TrenchRun.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Trench Run prototype (build ${{ github.run_number }})" \
            --notes "Latest automatic build from main. Download TrenchRun.apk on your Android phone and open it to install (allow installs from your browser when asked)."
